<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- The phone browser bar matches the page (--paper); theme.ts follows the Light / Dark switch. -->
		<meta name="theme-color" content="#f5f3f2" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#141213" media="(prefers-color-scheme: dark)" />
		<script>
			try {
				const t = localStorage.getItem('theme');
				if (t === 'light' || t === 'dark') {
					document.documentElement.dataset.theme = t;
					for (const m of document.querySelectorAll('meta[name="theme-color"]')) m.content = t === 'dark' ? '#141213' : '#f5f3f2';
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
